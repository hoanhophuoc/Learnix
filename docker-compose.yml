# ==============================================================================
# Docker Compose
# Usage: docker compose up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: learnix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learnix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
    container_name: learnix-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: ''
      APP_NAME: api
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-learnix}
      TYPEORM_SYNCHRONIZE: 'false'
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    env_file:
      - path: ./apps/api/.env
        required: false
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: web
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: learnix-frontend
    # Note: Vite build-time env vars (VITE_*) must be present in .env during build
    # or passed as build args. We pass VITE_API_URL as a build arg above.
    environment:
      APP_NAME: web
    env_file:
      - path: ./apps/web/.env
        required: false
    ports:
      - '5173:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
