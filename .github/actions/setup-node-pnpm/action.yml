# ==============================================================================
# Composite Action: Setup Node.js + pnpm with Caching
# Reusable setup for all Node.js workflows
# ==============================================================================

name: Setup Node.js and pnpm
description: Setup Node.js, pnpm, and cache dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  working-directory:
    description: Working directory for the project (used for compatibility; the workspace root is installed)
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve repository package manager
      id: package-manager
      shell: bash
      run: |
        set -euo pipefail
        package_manager="$(node -p "require('./package.json').packageManager")"
        case "$package_manager" in
          pnpm@*) echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::The repository packageManager must use the pnpm@<version> format" >&2; exit 1 ;;
        esac

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.package-manager.outputs.version }}

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Cache pnpm dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
