name: Notify workflow result
description: Send a non-blocking workflow result notification

inputs:
  status:
    description: Workflow result
    required: true
  environment:
    description: Deployment environment or workflow context
    required: true
  message:
    description: Human-readable notification message
    required: true
  webhook-url:
    description: Notification webhook URL
    required: true
  provider-links:
    description: Safe provider links or identifiers
    required: false
    default: ''
  priority:
    description: Notification priority
    required: false
    default: normal

runs:
  using: composite
  steps:
    - name: Send notification
      shell: bash
      env:
        NOTIFICATION_STATUS: ${{ inputs.status }}
        NOTIFICATION_ENVIRONMENT: ${{ inputs.environment }}
        NOTIFICATION_MESSAGE: ${{ inputs.message }}
        NOTIFICATION_WEBHOOK_URL: ${{ inputs.webhook-url }}
        NOTIFICATION_PROVIDER_LINKS: ${{ inputs.provider-links }}
        NOTIFICATION_PRIORITY: ${{ inputs.priority }}
      run: |
        set -euo pipefail
        payload="$(jq -n \
          --arg repository "$GITHUB_REPOSITORY" \
          --arg commit "$GITHUB_SHA" \
          --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --arg environment "$NOTIFICATION_ENVIRONMENT" \
          --arg status "$NOTIFICATION_STATUS" \
          --arg message "$NOTIFICATION_MESSAGE" \
          --arg provider_links "$NOTIFICATION_PROVIDER_LINKS" \
          --arg priority "$NOTIFICATION_PRIORITY" \
          '{repository: $repository, commit: $commit, workflow_run_url: $run_url, environment: $environment, result: $status, priority: $priority, message: $message, provider_links: $provider_links}')"
        if ! curl --fail --silent --show-error --max-time 10 \
          -X POST \
          -H 'Content-Type: application/json' \
          --data "$payload" \
          "$NOTIFICATION_WEBHOOK_URL"; then
          echo "::warning::Workflow notification failed; the primary workflow result is unchanged."
        fi
